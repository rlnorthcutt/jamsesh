<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>

  
  :root{
    --bg: #FAFAF8;
    --surface: #FFFFFF;
    --surface-2: #F0EFEC;
    --text: #16171A;
    --text-dim: #6B6D72;
    --line: #DEDDD8;
    --accent: #E85D2C;
    --accent-text: #FFFFFF;
    --string: #C9C7C0;
    --radius: 14px;
    --font-display: 'Space Grotesk', sans-serif;
    --font-body: 'IBM Plex Sans', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  html.dark{
    --bg: #121214;
    --surface: #1B1B1E;
    --surface-2: #232326;
    --text: #F2F1ED;
    --text-dim: #97989D;
    --line: #313134;
    --accent: #FF7A45;
    --accent-text: #16171A;
    --string: #3A3A3D;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family: var(--font-body); background: #E8E6E0;
    display:flex; flex-direction:column; align-items:center; padding:32px 12px;
    min-height:100vh; color:var(--text);
  }
  html.dark body{ background:#08080a; }

  .toolbar{
    display:flex; gap:10px; align-items:center; margin-bottom:18px; flex-wrap:wrap; justify-content:center;
  }
  .toolbar button{
    font-family:var(--font-body); font-size:13px; font-weight:600; padding:8px 14px;
    border-radius:999px; border:1px solid #00000022; background:#fff; cursor:pointer; color:#16171A;
  }
  .toolbar button.active{ background:var(--text); color:var(--bg); border-color:var(--text); }

  .phone{
    width:390px; height:780px; background:var(--bg); border-radius:40px; overflow:hidden;
    box-shadow: 0 30px 60px -20px rgba(0,0,0,0.4), 0 0 0 8px #0a0a0a, 0 0 0 9px #2a2a2a;
    position:relative; display:flex; flex-direction:column;
  }
  .notch{
    position:absolute; top:0; left:50%; transform:translateX(-50%); width:120px; height:22px;
    background:#0a0a0a; border-radius:0 0 14px 14px; z-index:50;
  }
  .screen{
    flex:1; display:none; flex-direction:column; overflow-y:auto; padding-top:34px;
  }
  .screen.active{ display:flex; }

  /* --- signature string-line motif --- */
  .strings{ display:flex; flex-direction:column; gap:2px; width:100%; }
  .strings div{ height:1px; background:var(--string); }
  .strings div:nth-child(1){ opacity:1; }
  .strings div:nth-child(2){ opacity:.8; }
  .strings div:nth-child(3){ opacity:.6; }
  .strings div:nth-child(4){ opacity:.45; }
  .strings div:nth-child(5){ opacity:.3; }
  .strings div:nth-child(6){ opacity:.18; }

  .strings-divider{ padding:0 20px; margin: 4px 0 10px; }

  /* --- header --- */
  .app-header{ padding:4px 20px 14px; }
  .app-header h1{
    font-family:var(--font-display); font-size:22px; margin:0 0 12px; font-weight:700; letter-spacing:-0.01em;
  }
  .search{
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; font-size:14px; color:var(--text-dim); display:flex; align-items:center; gap:8px;
  }
  .tabs-row{ display:flex; gap:22px; padding:16px 20px 0; }
  .tabs-row .tab{ font-family:var(--font-display); font-weight:600; font-size:14px; color:var(--text-dim); padding-bottom:10px; cursor:pointer; }
  .tabs-row .tab.active{ color:var(--text); border-bottom:2px solid var(--accent); }

  .list{ padding:6px 20px 90px; }
  .row{
    display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .thumb{
    width:46px; height:46px; border-radius:9px; background:var(--surface-2); flex-shrink:0;
    display:flex; align-items:center; justify-content:center; font-size:18px; overflow:hidden;
    background-size:cover; background-position:center;
  }
  .row-main{ flex:1; min-width:0; }
  .row-title{ font-family:var(--font-display); font-weight:600; font-size:15px; display:flex; gap:6px; align-items:baseline; }
  .row-title .v{ font-size:11px; color:var(--text-dim); font-weight:500; }
  .row-sub{ font-size:12.5px; color:var(--text-dim); margin-top:2px; }
  .badge{
    font-size:10.5px; font-weight:600; padding:4px 8px; border-radius:7px; border:1px solid var(--line); color:var(--text-dim); white-space:nowrap;
  }

  .fab{
    position:absolute; right:20px; bottom:88px; width:52px; height:52px; border-radius:16px;
    background:var(--accent); color:var(--accent-text); border:none; font-size:24px; font-weight:600;
    display:flex; align-items:center; justify-content:center; cursor:pointer; box-shadow:0 8px 20px -6px rgba(232,93,44,.6);
  }

  .bottom-nav{
    position:absolute; bottom:0; left:0; right:0; background:var(--surface); border-top:1px solid var(--line);
    display:flex; padding:10px 8px 20px;
  }
  .bottom-nav .nav-item{
    flex:1; display:flex; flex-direction:column; align-items:center; gap:3px; font-size:10.5px;
    color:var(--text-dim); font-weight:600; cursor:pointer;
  }
  .bottom-nav .nav-item.active{ color:var(--accent); }
  .nav-icon{ font-size:18px; }

  /* session banner */
  .session-banner{
    margin:0 20px 6px; background:var(--surface-2); border:1px solid var(--line); border-radius:12px;
    padding:11px 14px; display:flex; align-items:center; gap:10px; cursor:pointer;
  }
  .pulse-dot{ width:8px; height:8px; border-radius:50%; background:var(--accent); flex-shrink:0; animation:pulse 1.6s infinite; }
  @keyframes pulse{ 0%{ box-shadow:0 0 0 0 rgba(232,93,44,.5);} 70%{ box-shadow:0 0 0 8px rgba(232,93,44,0);} 100%{box-shadow:0 0 0 0 rgba(232,93,44,0);} }
  .session-banner-text{ flex:1; font-size:12.5px; line-height:1.4; }
  .session-banner-text b{ display:block; font-family:var(--font-display); font-size:13.5px; }
  .session-jump{ font-size:11.5px; font-weight:700; color:var(--accent); white-space:nowrap; }

  /* song detail */
  .song-detail-header{ padding:2px 20px 0; }
  .back-row{ display:flex; align-items:center; gap:14px; font-size:13px; color:var(--text-dim); margin-bottom:10px; cursor:pointer; }
  .song-title-block h2{ font-family:var(--font-display); font-size:24px; margin:0 0 2px; font-weight:700; }
  .song-title-block .artist{ font-size:13.5px; color:var(--text-dim); text-decoration:underline; text-decoration-color:var(--line); }
  .meta-row{ display:flex; gap:16px; margin:12px 0 4px; font-size:11.5px; color:var(--text-dim); }
  .meta-row b{ color:var(--text); font-family:var(--font-mono); }

  .sheet-tabs{
    display:flex; gap:0; overflow-x:auto; padding:14px 20px 0; border-bottom:1px solid var(--line); margin-top:8px;
  }
  .sheet-tab{
    font-family:var(--font-display); font-weight:600; font-size:13px; color:var(--text-dim);
    padding:0 14px 12px; white-space:nowrap; cursor:pointer; border-bottom:2px solid transparent;
  }
  .sheet-tab.active{ color:var(--text); border-bottom-color:var(--accent); }

  .controls-row{ display:flex; gap:8px; padding:14px 20px; }
  .pill-btn{
    font-size:12px; font-weight:600; padding:8px 13px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); color:var(--text); cursor:pointer;
  }

  .chord-body{
    margin:0 20px 100px; background:var(--surface); border:1px solid var(--line); border-radius:14px;
    padding:18px 16px; font-family:var(--font-mono); font-size:13.5px; line-height:2; white-space:pre;
    overflow-x:auto;
  }
  .chord-body .chord{ color:var(--accent); font-weight:600; }
  .chord-body .section-label{ color:var(--text-dim); font-weight:600; display:block; margin-top:14px; }

  .form-wrap{ padding:6px 20px 100px; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field input, .field select, .field textarea{
    width:100%; font-family:var(--font-body); font-size:14px; padding:11px 12px; border-radius:10px;
    border:1px solid var(--line); background:var(--surface); color:var(--text);
  }
  .field textarea{ font-family:var(--font-mono); min-height:140px; resize:vertical; }
  .primary-btn{
    width:100%; padding:13px; border-radius:12px; border:none; background:var(--accent); color:var(--accent-text);
    font-family:var(--font-display); font-weight:700; font-size:14px; cursor:pointer; margin-top:6px;
  }
  .chip-row{ display:flex; flex-wrap:wrap; gap:8px; }
  .chip{
    font-size:12px; font-weight:600; padding:8px 12px; border-radius:999px; border:1px solid var(--line);
    background:var(--surface); cursor:pointer; color:var(--text-dim);
  }
  .chip.selected{ background:var(--text); color:var(--bg); border-color:var(--text); }

  /* playlist cards */
  .pl-card{
    display:flex; align-items:center; gap:12px; padding:14px 0; border-bottom:1px solid var(--line); cursor:pointer;
  }
  .pl-thumb{ width:52px; height:52px; border-radius:10px; overflow:hidden; display:grid; grid-template-columns:1fr 1fr; flex-shrink:0; }
  .pl-thumb div{ background-size:cover; background-position:center; }
  .pl-main b{ font-family:var(--font-display); font-size:15px; display:block; }
  .pl-main span{ font-size:12.5px; color:var(--text-dim); }

  /* join / session start */
  .center-block{ flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center; text-align:center; padding:24px; gap:18px; }
  .qr-box{
    width:170px; height:170px; border-radius:16px; background:var(--surface); border:1px solid var(--line);
    display:flex; align-items:center; justify-content:center; font-size:12px; color:var(--text-dim);
  }
  .code-display{
    font-family:var(--font-mono); font-size:32px; font-weight:600; letter-spacing:6px; padding:14px 20px;
    background:var(--surface); border:1px solid var(--line); border-radius:12px;
  }

  .empty-hint{ font-size:13px; color:var(--text-dim); text-align:center; padding:40px 30px; line-height:1.6; }

  .section-title{ font-family:var(--font-display); font-weight:600; font-size:12.5px; color:var(--text-dim); padding:16px 20px 4px; text-transform:uppercase; letter-spacing:.04em; }


html,body{ margin:0; padding:0; background:#E8E6E0; }
.frame{
  width:390px; height:844px; position:relative; overflow:hidden;
  background:var(--bg); border-radius:0;
}
.frame .screen{ display:flex !important; position:absolute; inset:0; }

</style>
</head>
<body>
<div class="frame">
  <div class="screen active" id="playlists">
    
    <div class="app-header">
      <h1>Playlists</h1>
      <div class="search">🔍 Search song or artist</div>
    </div>
    <div class="strings-divider"><div class="strings"><div></div><div></div><div></div><div></div><div></div><div></div></div></div>
    <div class="list" style="padding-top:0;">
      <div class="pl-card" onclick="go('playlistdetail')">
        <div class="pl-thumb"><div style="background:#c9a876;"></div><div style="background:#5a6b8c;"></div></div>
        <div class="pl-main"><b>Campfire cathedral</b><span>33 songs</span></div>
      </div>
      <div class="pl-card">
        <div class="pl-thumb"><div style="background:#2b2b2e;"></div><div style="background:#e2ddd2;"></div></div>
        <div class="pl-main"><b>2023</b><span>16 songs</span></div>
      </div>
      <div class="pl-card">
        <div class="pl-thumb"><div style="background:#8c3b2b;"></div><div style="background:#3b5b8c;"></div></div>
        <div class="pl-main"><b>2022 bonfire</b><span>10 songs</span></div>
      </div>
      <div class="pl-card">
        <div class="pl-thumb"><div style="background:#4c6b4f;"></div><div style="background:#1b1b1e;"></div></div>
        <div class="pl-main"><b>Yousician</b><span>7 songs</span></div>
      </div>
    </div>
    <button class="fab" style="bottom:88px;">+</button>
    <div class="bottom-nav">
      <div class="nav-item" onclick="go('songs')"><div class="nav-icon">🎵</div>Songs</div>
      <div class="nav-item active"><div class="nav-icon">📃</div>Playlists</div>
      <div class="nav-item" onclick="go('join')"><div class="nav-icon">📡</div>Session</div>
    </div>
  
  </div>
</div>
</body>
</html>
